# Publishes the built course (dist/ only) to GitHub Pages.
# Runs on every push to main and on manual dispatch. Nothing here changes repository settings: the owner must set
# Settings > Pages > Source to "GitHub Actions" once, by hand, before the deploy job can succeed. See docs/DEPLOYMENT.md.
# Every action is pinned to a full commit SHA that was checked against the upstream tag on 2026-10-18.
name: Deploy course to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The default token can only read the repository. The deploy job alone gets the two Pages scopes.
permissions:
  contents: read

# One deployment at a time, and a newer push never cancels one that is mid-deploy.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build:
    # Only main is ever published, even when the workflow is dispatched from another ref.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Regenerate the fictional dataset
        run: npm run data
      - name: Prove every authored answer against the data
        run: npm run validate:content
      - name: Unit tests (engine, grader, content, progress, contrast, artifact)
        run: npm test
      - name: Build dist/ and check the artifact allowlist
        run: npm run build
      - name: Upload dist/ only
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  # Browser tests run on the same commit at the root and under /KC7SecOpsClaude/, in parallel with build.
  # They do not gate deploy: the Chromium install adds a minute or more and the artifact is already proven by the
  # content validator, the unit tests and the artifact check. A red result here is still visible on the run and
  # should be treated as a bug to fix on main. To make it gate, add "browser" to the deploy job's needs list.
  browser:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run data
      - run: npm run build
      - name: Browser tests at the root and under the repository subpath
        run: npm run test:browser

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy the uploaded artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
